<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>I love you</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000; /* 默认黑色 */
    }

    /* 背景层：优先显示图片 '星空.jpg'，保底为深邃渐变 */
    #bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      background-image: url('星空.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    .bottom-text {
      position: fixed;
      bottom: 20px;
      right: 20px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      font-family: sans-serif;
      text-shadow: 0 0 5px rgba(255,255,255,0.5);
      z-index: 1000;
      pointer-events: none;
    }

    /* --- 按钮样式：星际水晶风格 --- */
    .continue-button {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 40px;
      font-size: 16px;
      font-family: "Microsoft YaHei", sans-serif;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      cursor: pointer;
      z-index: 2000;
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 0;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .continue-button.show {
      bottom: 80px;
      opacity: 1;
    }

    .continue-button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 25px rgba(100, 200, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.2);
      transform: translateX(-50%) translateY(-3px) scale(1.05);
      color: #fff;
    }
  </style>
</head>

<body>
  <div id="bg-layer"></div>
  <canvas id="c1" style="display:none;"></canvas>
  <canvas id="c2"></canvas>
  <canvas id="c3"></canvas>
  
  <div class="bottom-text">2002.12.28 and 2005.10.06</div>
  <button class="continue-button" id="continueBtn">To be continued... ✨</button>

  <script>
    const CONFIG = {
      particleCount: 100,  // 【优化】从270大幅降到100，减轻渲染负担
      fidelity: 3,         // 像素精度
      fontSize: 220,       // 字号
      text: 'Lara，I love you', // 文字内容
      fontFamily: '"HanYiShangWei", "YuWei", "KaiTi", "Comic Sans MS", cursive, sans-serif'
    };

    const c1 = document.getElementById('c1');
    const c2 = document.getElementById('c2');
    const c3 = document.getElementById('c3');
    const ctx1 = c1.getContext('2d');
    const ctx2 = c2.getContext('2d');
    const ctx3 = c3.getContext('2d');

    let w = window.innerWidth;
    let h = window.innerHeight;
    c2.width = c3.width = w;
    c2.height = c3.height = h;

    // --- 1. 文字像素初始化 ---
    ctx1.fillStyle = '#000';
    let textWidth = 99999999;
    let currentFontSize = CONFIG.fontSize;
    // 适配屏幕宽度
    while (textWidth > w * 0.85) {
      ctx1.font = `900 ${currentFontSize--}px ${CONFIG.fontFamily}`;
      textWidth = ctx1.measureText(CONFIG.text).width;
    }
    c1.width = textWidth;
    c1.height = currentFontSize * 1.5;
    ctx1.font = `900 ${currentFontSize}px ${CONFIG.fontFamily}`;
    ctx1.fillText(CONFIG.text, 0, currentFontSize);
    
    const imgData = ctx1.getImageData(0, 0, c1.width, c1.height);
    const targets = [];
    for (let i = 0; i < imgData.data.length; i += 4) {
      if (imgData.data[i + 3] > 128) {
        const x = (i / 4) % c1.width;
        const y = Math.floor((i / 4) / c1.width);
        if (x % CONFIG.fidelity === 0 && y % CONFIG.fidelity === 0) {
          targets.push({ x, y });
        }
      }
    }

    // 设置c3文字层的样式（移除性能杀手 shadowBlur）
    // ctx3.shadowColor = '#FFF';
    // ctx3.shadowBlur = 10;

    function getTarget() {
      if (targets.length > 0) {
        const idx = Math.floor(Math.random() * targets.length);
        let { x, y } = targets[idx];
        targets.splice(idx, 1);
        x += (w - textWidth) / 2;
        y += (h - currentFontSize) / 2;
        return { x, y };
      }
    }

    // --- 2. 梦幻流星类 (移除 shadowBlur) ---
    class Meteor {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * w + 300; 
        this.y = Math.random() * -100;
        this.len = Math.random() * 200 + 150;
        this.size = Math.random() * 0.5 + 0.5;
        this.speed = Math.random() * 0.5 + 2; 
        this.angle = Math.PI / 4 + (Math.random() * 0.2); 
        this.hue = Math.random() * 50 + 200;
        this.active = true;
      }

      update() {
        this.x -= this.speed * Math.cos(this.angle);
        this.y += this.speed * Math.sin(this.angle);
        if (this.x < -300 || this.y > h + 300) {
          this.reset();
        }
      }

      draw() {
        ctx2.save();
        ctx2.translate(this.x, this.y);
        ctx2.rotate(Math.PI - this.angle);
        
        ctx2.fillStyle = '#fff';
        ctx2.beginPath();
        ctx2.arc(0, 0, this.size * 2, 0, Math.PI * 2);
        ctx2.fill();

        const gradient = ctx2.createLinearGradient(0, 0, -this.len, 0);
        gradient.addColorStop(0, "rgba(255, 255, 255, 1)");
        gradient.addColorStop(0.1, `hsla(${this.hue}, 100%, 80%, 0.8)`);
        gradient.addColorStop(1, "transparent");

        ctx2.fillStyle = gradient;
        ctx2.beginPath();
        ctx2.moveTo(0, -this.size * 0.5);
        ctx2.lineTo(-this.len, 0);
        ctx2.lineTo(0, this.size * 0.5);
        ctx2.fill();
        
        ctx2.restore();
      }
    }

    // --- 3. 烟花碎片 (移除 shadowBlur 和 save/restore) ---
    class Shard {
      constructor(x, y, hue) {
        this.x = x; this.y = y; 
        this.hue = Math.floor(Math.random() * 140) + 180;
        this.target = getTarget();
        this.angle = Math.random() * Math.PI * 2;
        this.speed = Math.random() * 3.5 + 2;
        this.friction = 0.95;
        this.gravity = 0.1;
        this.size = 2;
        this.timer = 0;
        this.ttl = 100 + Math.random() * 50;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.lightness = 70 + Math.random() * 25;
        this.color = `hsl(${this.hue}, 100%, ${this.lightness}%)`;
        this.glowColor = `hsl(${this.hue}, 100%, 60%)`;
      }
      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        
        if (this.target) {
            const dx = this.target.x - this.x;
            const dy = this.target.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 50) {
                this.vx += dx * 0.005;
                this.vy += dy * 0.005;
            }
        }
        this.x += this.vx;
        this.y += this.vy;
        this.timer++;
      }
      draw() {
        // 简化绘制逻辑，完全依赖全局的 lighter 模式
        const lightness = 40 + Math.random() * 30; 
        ctx2.fillStyle = `hsl(${this.hue}, 100%, ${lightness}%)`;
        ctx2.beginPath();
        ctx2.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx2.fill();
      }
    }

    class Rocket {
      constructor() {
        this.x = Math.random() * w; 
        this.y = h;
        this.hue = Math.random() * 360;
        this.targetY = h * 0.15 + Math.random() * h * 0.25; 
        this.vy = -(10 + Math.random() * 5); 
        this.vx = (Math.random() - 0.5) * 2; 
        this.exploded = false;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.12; 
        
        if (this.vy >= 0 || this.y < this.targetY) {
            this.explode();
            return false; 
        }
        return true; 
      }
      draw() {
        ctx2.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
        ctx2.fillRect(this.x, this.y, 3, 10);
      }
      explode() {
        const count = CONFIG.particleCount;
        for(let i=0; i<count; i++) {
            shards.push(new Shard(this.x, this.y, this.hue));
        }
      }
    }

    // --- 4. 动画循环 ---
    const meteors = Array.from({length: 12}, () => new Meteor());
    let rockets = [];
    let shards = [];
    let tick = 0;

    function loop() {
      // 清除画布（制造拖尾效果）
      ctx2.globalCompositeOperation = 'destination-out';
      ctx2.fillStyle = 'rgba(0, 0, 0, 0.15)'; 
      ctx2.fillRect(0, 0, w, h);
      ctx2.globalCompositeOperation = 'source-over';

      tick++;

      // 绘制流星
      meteors.forEach(m => { m.update(); m.draw(); });

      // 绘制火箭（【优化】把 20 改成 40，减少同时发射的火箭数量）
      if (tick % 40 === 0 && targets.length > 0) {
        rockets.push(new Rocket());
      }
      
      // 更新火箭
      rockets = rockets.filter(r => {
        r.draw();
        return r.update();
      });

      // 更新碎片 (【核心优化】在循环外部启用 lighter 模式，大幅减少状态切换开销)
      ctx2.save();
      ctx2.globalCompositeOperation = 'lighter'; 
      
      for (let i = shards.length - 1; i >= 0; i--) {
        const s = shards[i];
        s.update();
        s.draw();

        if (s.timer > s.ttl) {
            if(s.target) {
                // 文字落点高光 (移除 shadowBlur)
                ctx3.save();
                ctx3.globalCompositeOperation = 'lighter';
                ctx3.fillStyle = s.color;
                ctx3.beginPath();
                ctx3.arc(s.target.x + CONFIG.fidelity/2, s.target.y + CONFIG.fidelity/2, CONFIG.fidelity/1.5, 0, Math.PI*2);
                ctx3.fill();
                ctx3.restore();
            }
            shards.splice(i, 1);
        }
      }
      ctx2.restore(); // 恢复画布状态

      requestAnimationFrame(loop);
    }

    loop();

    // 窗口调整
    window.addEventListener('resize', () => {
        w = window.innerWidth;
        h = window.innerHeight;
        c2.width = c3.width = w;
        c2.height = c3.height = h;
    });

    // --- 新增按钮逻辑 ---
    setTimeout(() => {
      const btn = document.getElementById('continueBtn');
      if (btn) {
        btn.classList.add('show');
      }
    }, 10000);

    // 点击跳转事件（已注释，需要时取消注释）
    // document.getElementById('continueBtn').addEventListener('click', () => {
    //   document.body.style.transition = 'opacity 1s';
    //   document.body.style.opacity = '0';
    //   setTimeout(() => {
    //     window.location.href = '结尾.html'; 
    //   }, 1000);
    // });

  </script>
  <!-- 如果音频文件 ed.mp3 很大，建议压缩或转码，否则也会造成加载卡顿 -->
  <audio src="../music/ed.mp3" autoplay loop></audio>
</body>
</html>
